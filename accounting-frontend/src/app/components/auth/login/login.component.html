<div class="login-container">
  <div class="login-card">
    <div class="card-header">
      <h2 class="text-center">Advanced Accounting</h2>
      <p class="text-center text-muted">Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          id="username"
          class="form-control"
          formControlName="username"
          [class.is-invalid]="isFieldInvalid('username')"
          placeholder="Enter your username"
        />
        <div *ngIf="isFieldInvalid('username')" class="invalid-feedback">
          {{ getFieldError('username') }}
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          class="form-control"
          formControlName="password"
          [class.is-invalid]="isFieldInvalid('password')"
          placeholder="Enter your password"
        />
        <div *ngIf="isFieldInvalid('password')" class="invalid-feedback">
          {{ getFieldError('password') }}
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="loading || loginForm.invalid"
      >
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>

    <!-- Sample Credentials Section -->
    <div class="sample-credentials mt-4">
      <h6 class="text-center">Sample Credentials (Click to Use)</h6>
      <div class="credentials-list">
        <div
          *ngFor="let credential of sampleCredentials"
          class="credential-item"
          (click)="fillSampleCredentials(credential)"
        >
          <div class="credential-info">
            <strong>{{ credential.description }}</strong>
            <div class="credential-details">
              <span>{{ credential.username }}</span> / <span>{{ credential.password }}</span>
            </div>
          </div>
          <i class="fa fa-copy"></i>
        </div>
      </div>
    </div>
  </div>
</div>
