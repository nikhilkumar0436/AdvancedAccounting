# Enable annotation processing
annotation.processing.enabled=true

# Processor path includes
processor.path=org.projectlombok:lombok:1.18.30
processor.path=org.hibernate:hibernate-jpamodelgen:6.4.1.Final
processor.path=org.springframework.boot:spring-boot-configuration-processor:3.4.5

# Generated sources directory
generated.sources.dir=target/generated-sources/annotations

# Enable specific processors
processor.org.projectlombok.LombokProcessor=true
processor.org.hibernate.jpamodelgen.JPAMetaModelEntityProcessor=true
processor.org.springframework.boot.configurationprocessor.ConfigurationMetadataAnnotationProcessor=true
